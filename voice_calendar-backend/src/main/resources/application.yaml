spring:
  application:
    name: voice_calendar-backend

  datasource:
    url: jdbc:mysql://localhost:3306/voice_calendar?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:qiniu-voice-calendar-secret-key-change-in-production}
  expiration: 7200000  # 2 hours in ms

logging:
  level:
    com.qiniu.voice_calendar: debug
