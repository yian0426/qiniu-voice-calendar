spring:
  application:
    name: voice_calendar-backend
  datasource:
    url: jdbc:mysql://localhost:3306/voice_calendar?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:qiniu-voice-calendar-secret-key-change-in-production}
  expiration: 7200000 # 2 hours in ms

ai:
  api-key: ${AI_API_KEY:sk-ceyc4g11cqje8qhpm327bb2bmtk9nzprmgx1e741f90fsw67}
  base-url: ${AI_BASE_URL:https://api.xiaomimimo.com/v1}
  model: ${AI_MODEL:mimo-v2.5-pro}
  format: ${AI_FORMAT:openai}
  auth-style: ${AI_AUTH_STYLE:api-key}

logging:
  level:
    com.qiniu.voice_calendar: debug
